name: Testes automáticos
on:
  push:
    paths: ['firestore.rules', 'tests/**', 'js/**', 'vendor/**', 'index.html', 'firebase.json', 'package.json', '.github/workflows/**']
  workflow_dispatch:
jobs:
  regras:
    name: Regras de segurança
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
      - run: npm run test:regras
  tela:
    name: Telas contra o emulador do Firebase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:tela
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: telas-com-falha
          path: falha-*.png
          if-no-files-found: ignore
