name: Testar regras de segurança
on:
  push:
    paths: ['firestore.rules', 'tests/**', '.github/workflows/testar-regras.yml']
  workflow_dispatch:
jobs:
  regras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
      - run: npm run test:regras
